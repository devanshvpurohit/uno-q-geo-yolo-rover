<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO Q Geo-YOLO Vision Rover</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff66;
            --accent-red: #ff3366;
            --text-main: #f0f4f8;
            --text-dim: #8b9bb4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 12px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #222f4c; }
        h1 { font-size: 1.1rem; color: var(--accent-cyan); letter-spacing: 0.5px; }
        .badge { font-size: 0.75rem; background: #1f2b45; padding: 4px 8px; border-radius: 12px; border: 1px solid var(--accent-cyan); }
        .container { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 900px; margin: 0 auto; }
        @media(min-width: 768px) { .container { grid-template-columns: 3fr 2fr; } }
        
        .card { background: var(--card-bg); border-radius: 10px; padding: 12px; border: 1px solid #1e2b45; }
        .video-box { position: relative; border-radius: 8px; overflow: hidden; background: #000; min-height: 240px; display: flex; justify-content: center; align-items: center; }
        .video-box img { width: 100%; height: auto; display: block; border-radius: 8px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .stat-card { background: #0d1322; border-radius: 6px; padding: 8px; border-left: 3px solid var(--accent-cyan); }
        .stat-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }
        .stat-val { font-size: 1rem; font-weight: bold; margin-top: 2px; color: #fff; }
        
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 260px; margin: 12px auto; }
        .btn { background: #1c2742; color: #fff; border: 1px solid #2d3e66; border-radius: 8px; padding: 14px; font-size: 1.1rem; cursor: pointer; user-select: none; transition: 0.1s; -webkit-tap-highlight-color: transparent; }
        .btn:active { background: var(--accent-cyan); color: #000; transform: scale(0.96); }
        .btn-stop { background: var(--accent-red); border-color: var(--accent-red); font-weight: bold; }
        
        .mode-bar { display: flex; gap: 8px; margin-top: 10px; }
        .btn-mode { flex: 1; padding: 10px; font-size: 0.85rem; font-weight: bold; border-radius: 6px; border: 1px solid #2d3e66; background: #141f36; color: #fff; cursor: pointer; }
        .btn-mode.active { background: var(--accent-green); color: #000; border-color: var(--accent-green); }
        
        .log-box { font-family: monospace; font-size: 0.75rem; background: #090d16; border-radius: 6px; padding: 8px; height: 110px; overflow-y: auto; color: #7cfc00; margin-top: 8px; }
        .actions-bar { margin-top: 10px; display: flex; justify-content: space-between; }
        .btn-sm { font-size: 0.75rem; padding: 6px 12px; background: #1f2b45; color: var(--accent-cyan); border: 1px solid var(--accent-cyan); border-radius: 4px; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>⚡ UNO Q Geo-YOLO Rover</h1>
        <span class="badge" id="connStatus">LIVE CONNECTED</span>
    </header>

    <div class="container">
        <!-- Vision Feed -->
        <div class="card">
            <div class="video-box">
                <img src="/video_feed" alt="Camera Stream" onerror="this.src=''; this.alt='Camera feed offline or loading...';">
            </div>
            <div class="grid-2">
                <div class="stat-card">
                    <div class="stat-label">Detected Target</div>
                    <div class="stat-val" id="detTarget">None</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Action</div>
                    <div class="stat-val" id="detAction" style="color: var(--accent-cyan);">STOP (S)</div>
                </div>
            </div>
        </div>

        <!-- Telemetry & Controls -->
        <div class="card">
            <h3 style="font-size: 0.9rem; color: var(--accent-cyan); margin-bottom: 8px;">TELEMETRY HUD</h3>
            <div class="grid-2">
                <div class="stat-card">
                    <div class="stat-label">GPS Latitude</div>
                    <div class="stat-val" id="gpsLat">0.000000</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">GPS Longitude</div>
                    <div class="stat-val" id="gpsLng">0.000000</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Ground Speed</div>
                    <div class="stat-val"><span id="gpsSpeed">0.0</span> km/h</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">IMU Pitch / Roll</div>
                    <div class="stat-val"><span id="imuAx">0.0</span> / <span id="imuAy">0.0</span> g</div>
                </div>
            </div>

            <div class="mode-bar">
                <button class="btn-mode active" id="btnAuto" onclick="setMode('auto')">AUTO (YOLO)</button>
                <button class="btn-mode" id="btnManual" onclick="setMode('manual')">MANUAL DRIVE</button>
            </div>

            <div class="controls" id="manualPad" style="opacity: 0.4; pointer-events: none;">
                <div></div>
                <button class="btn" onclick="sendCmd('F')">▲</button>
                <div></div>
                <button class="btn" onclick="sendCmd('L')">◀</button>
                <button class="btn btn-stop" onclick="sendCmd('S')">■</button>
                <button class="btn" onclick="sendCmd('R')">▶</button>
                <div></div>
                <button class="btn" onclick="sendCmd('B')">▼</button>
                <div></div>
            </div>

            <div class="actions-bar">
                <span style="font-size: 0.75rem; color: var(--text-dim);">Live Mission Log</span>
                <a href="/api/download_log" class="btn-sm" download>Export CSV Log</a>
            </div>
            <div class="log-box" id="eventLog">Waiting for telemetry...</div>
        </div>
    </div>

    <script>
        let currentMode = 'auto';

        function setMode(mode) {
            currentMode = mode;
            fetch('/api/mode/' + mode, { method: 'POST' });
            document.getElementById('btnAuto').classList.toggle('active', mode === 'auto');
            document.getElementById('btnManual').classList.toggle('active', mode === 'manual');
            const pad = document.getElementById('manualPad');
            pad.style.opacity = mode === 'manual' ? '1.0' : '0.4';
            pad.style.pointerEvents = mode === 'manual' ? 'auto' : 'none';
        }

        function sendCmd(cmd) {
            fetch('/api/control/' + cmd, { method: 'POST' });
        }

        function updateTelemetry() {
            fetch('/api/telemetry')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('gpsLat').innerText = data.lat.toFixed(6);
                    document.getElementById('gpsLng').innerText = data.lng.toFixed(6);
                    document.getElementById('gpsSpeed').innerText = data.speed.toFixed(1);
                    document.getElementById('imuAx').innerText = data.ax.toFixed(2);
                    document.getElementById('imuAy').innerText = data.ay.toFixed(2);
                    document.getElementById('detTarget').innerText = data.last_target || 'Scanning...';
                    document.getElementById('detAction').innerText = data.current_action;
                    
                    if (data.events && data.events.length) {
                        const logEl = document.getElementById('eventLog');
                        logEl.innerHTML = data.events.slice(-5).map(e => `[${e.time}] ${e.text}`).join('<br>');
                    }
                })
                .catch(() => {
                    document.getElementById('connStatus').innerText = 'OFFLINE';
                    document.getElementById('connStatus').style.color = '#ff3366';
                });
        }

        setInterval(updateTelemetry, 500);
    </script>
</body>
</html>
